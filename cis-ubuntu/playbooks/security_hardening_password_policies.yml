---
- name: Security Hardening - Password Policies
  hosts: all
  become: yes
  vars_files:
    - ../group_vars/all.yml
  vars:
    results_dir: "../results"
    
  tasks:
    - name: Ensure results directory exists
      file:
        path: "{{ results_dir }}"
        state: directory
        mode: '0755'
        
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
        
    - name: Install required packages for password policies
      apt:
        name:
          - libpam-pwquality
          - cracklib-runtime
          - fail2ban
        state: present
        
    # Password History Configuration
    - name: Configure password history in PAM
      lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^password.*pam_unix.so'
        line: 'password [success=1 default=ignore] pam_unix.so obscure sha512 shadow nullok try_first_pass use_authtok remember=5'
        backup: yes
        
    - name: Enable password history enforcement for root
      lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^password.*pam_pwhistory.so'
        line: 'password requisite pam_pwhistory.so remember=5 use_authtok enforce_for_root'
        backup: yes
        create: yes
        
    # Password Quality Configuration
    - name: Configure password quality requirements
      blockinfile:
        path: /etc/security/pwquality.conf
        block: |
          # Minimum password length
          minlen = 14
          
          # Minimum number of character classes
          minclass = 3
          
          # Maximum consecutive same characters
          maxrepeat = 3
          
          # Require at least one lowercase letter
          lcredit = -1
          
          # Require at least one uppercase letter  
          ucredit = -1
          
          # Require at least one digit
          dcredit = -1
          
          # Require at least one special character
          ocredit = -1
          
          # Check for username in password
          usercheck = 1
          
          # Check for common words
          dictcheck = 1
        backup: yes
        
    # Account Lockout Configuration (faillock)
    - name: Configure account lockout policy
      blockinfile:
        path: /etc/security/faillock.conf
        block: |
          # Directory where faillock files are stored
          dir = /run/faillock
          
          # Number of failed attempts before lockout
          deny = 4
          
          # Lockout duration in seconds (15 minutes)
          unlock_time = 900
          
          # Even root users can be locked out
          even_deny_root
          
          # Root unlock time
          root_unlock_time = 900
        backup: yes
        create: yes
        
    - name: Enable faillock in PAM authentication
      lineinfile:
        path: /etc/pam.d/common-auth
        regexp: '^auth.*pam_faillock.so'
        line: 'auth [default=die] pam_faillock.so preauth silent deny=4 unlock_time=900 faillock_audit'
        backup: yes
        insertbefore: '^auth.*pam_unix.so'
        
    - name: Enable faillock in PAM account phase
      lineinfile:
        path: /etc/pam.d/common-account
        regexp: '^account.*pam_faillock.so'
        line: 'account required pam_faillock.so'
        backup: yes
        create: yes
        
    # Password Hashing Algorithm
    - name: Set SHA512 as default password hashing algorithm
      lineinfile:
        path: /etc/pam.d/common-password
        regexp: '^password.*pam_unix.so'
        line: 'password [success=1 default=ignore] pam_unix.so obscure sha512 shadow nullok try_first_pass use_authtok remember=5'
        backup: yes
        
    - name: Configure password hashing in /etc/login.defs
      lineinfile:
        path: /etc/login.defs
        regexp: '^ENCRYPT_METHOD'
        line: 'ENCRYPT_METHOD SHA512'
        backup: yes
        
    # Password Aging Policies
    - name: Configure password aging policies
      lineinfile:
        path: /etc/login.defs
        regexp: '^{{ item.key }}'
        line: '{{ item.key }} {{ item.value }}'
        backup: yes
      loop:
        - { key: 'PASS_MAX_DAYS', value: '90' }
        - { key: 'PASS_MIN_DAYS', value: '1' }
        - { key: 'PASS_WARN_AGE', value: '7' }
        
    # Create password policy summary report
    - name: Generate password policy configuration report
      shell: |
        echo "=== Password Policy Configuration Report ===" > /tmp/password-policy-report.txt
        echo "Generated: $(date)" >> /tmp/password-policy-report.txt
        echo "" >> /tmp/password-policy-report.txt
        
        echo "=== PAM Configuration ===" >> /tmp/password-policy-report.txt
        echo "/etc/pam.d/common-password:" >> /tmp/password-policy-report.txt
        grep -E "(pam_unix|pam_pwhistory)" /etc/pam.d/common-password >> /tmp/password-policy-report.txt 2>/dev/null || echo "No password policies found" >> /tmp/password-policy-report.txt
        echo "" >> /tmp/password-policy-report.txt
        
        echo "=== Password Quality Settings ===" >> /tmp/password-policy-report.txt
        grep -v "^#" /etc/security/pwquality.conf | grep -v "^$" >> /tmp/password-policy-report.txt 2>/dev/null || echo "No pwquality settings found" >> /tmp/password-policy-report.txt
        echo "" >> /tmp/password-policy-report.txt
        
        echo "=== Account Lockout Settings ===" >> /tmp/password-policy-report.txt
        cat /etc/security/faillock.conf >> /tmp/password-policy-report.txt 2>/dev/null || echo "No faillock settings found" >> /tmp/password-policy-report.txt
        echo "" >> /tmp/password-policy-report.txt
        
        echo "=== Login.defs Settings ===" >> /tmp/password-policy-report.txt
        grep -E "(PASS_MAX_DAYS|PASS_MIN_DAYS|PASS_WARN_AGE|ENCRYPT_METHOD)" /etc/login.defs >> /tmp/password-policy-report.txt 2>/dev/null || echo "No login.defs settings found" >> /tmp/password-policy-report.txt
        echo "" >> /tmp/password-policy-report.txt
        
        echo "=== Active Password Policies ===" >> /tmp/password-policy-report.txt
        chage -l root | head -5 >> /tmp/password-policy-report.txt 2>/dev/null || echo "Cannot get password aging info" >> /tmp/password-policy-report.txt
        
      register: policy_report
        
    - name: Ensure local results directory exists for host
      file:
        path: "{{ results_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false
        
    - name: Fetch password policy report to local
      fetch:
        src: "/tmp/password-policy-report.txt"
        dest: "{{ results_dir }}/{{ inventory_hostname }}/password-policy-report-{{ ansible_date_time.iso8601 }}.txt"
        flat: yes
        
    - name: Display password policy hardening status
      debug:
        msg: "Password policy hardening completed. Report saved to {{ results_dir }}/"
