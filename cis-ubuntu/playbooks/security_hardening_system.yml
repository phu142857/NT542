---
- name: Security Hardening - System Services & Kernel
  hosts: all
  become: yes
  vars_files:
    - ../group_vars/all.yml
  vars:
    results_dir: "../results"
    
  tasks:
    - name: Ensure results directory exists
      file:
        path: "{{ results_dir }}"
        state: directory
        mode: '0755'
        
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
        
    # Remove unnecessary services and packages
    - name: Remove unnecessary network services
      apt:
        name:
          - telnetd
          - rsh-server
          - talk-server
          - tftpd-hpa
          - nfs-kernel-server
          - rpcbind
          - squid
          - samba
          - net-snmp
          - cups
          - xinetd
          - ypserv
          - rsync
        state: absent
      ignore_errors: yes
        
    - name: Remove telnet clients
      apt:
        name:
          - telnet
          - inetutils-telnet
        state: absent
      ignore_errors: yes
        
    # Disable services
    - name: Disable unnecessary services
      systemd:
        name: "{{ item }}"
        state: stopped
        enabled: no
      loop:
        - rpcbind
        - nfs
        - tftp
        - cups
        - squid
        - smbd
        - nmbd
        - snmpd
        - rsync
      ignore_errors: yes
        
    # Install and configure auditd
    - name: Install auditd
      apt:
        name:
          - auditd
          - audispd-plugins
        state: present
        
    - name: Configure auditd rules for security monitoring
      blockinfile:
        path: /etc/audit/rules.d/audit.rules
        block: |
          # Security Monitoring Rules
          
          # Monitor file deletions
          -a always,exit -F arch=b64 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
          -a always,exit -F arch=b32 -S unlink -S unlinkat -S rename -S renameat -F auid>=1000 -F auid!=4294967295 -k delete
          
          # Monitor privileged commands
          -a always,exit -F arch=b64 -S execve -F euid=0 -F auid>=1000 -F auid!=4294967295 -k privileged_cmd
          -a always,exit -F arch=b32 -S execve -F euid=0 -F auid>=1000 -F auid!=4294967295 -k privileged_cmd
          
          # Monitor login events
          -w /var/log/lastlog -p wa -k logins
          -w /var/run/faillock -p wa -k logins
          -w /var/log/tallylog -p wa -k logins
          
          # Monitor SSH configuration
          -w /etc/ssh/sshd_config -p wa -k ssh_config
          
          # Monitor password files
          -w /etc/passwd -p wa -k identity
          -w /etc/shadow -p wa -k identity
          -w /etc/group -p wa -k identity
          -w /etc/gshadow -p wa -k identity
          
          # Monitor sudo configuration
          -w /etc/sudoers -p wa -k sudo_config
          -w /etc/sudoers.d/ -p wa -k sudo_config
          
          # Monitor system calls
          -a always,exit -F arch=b64 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k perm_mod
          -a always,exit -F arch=b32 -S chmod -S fchmod -S fchmodat -F auid>=1000 -F auid!=4294967295 -k perm_mod
          
          -a always,exit -F arch=b64 -S chown -S fchown -S fchownat -S lchown -F auid>=1000 -F auid!=4294967295 -k perm_mod
          -a always,exit -F arch=b32 -S chown -S fchown -S fchownat -S lchown -F auid>=1000 -F auid!=4294967295 -k perm_mod
          
        create: yes
        backup: yes
        
    - name: Configure auditd settings
      blockinfile:
        path: /etc/audit/auditd.conf
        block: |
          # Audit Configuration
          log_file = /var/log/audit/audit.log
          log_format = RAW
          log_group = root
          priority_boost = 4
          flush = INCREMENTAL
          freq = 20
          max_log_file = 6
          num_logs = 5
          max_log_file_action = keep_logs
          space_left = 75
          space_left_action = email
          action_mail_acct = root
          admin_space_left = 50
          admin_space_left_action = halt
          disk_full_action = halt
          disk_error_action = halt
        backup: yes
        
    # Kernel security parameters
    - name: Configure kernel security parameters
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-security.conf
        reload: yes
      loop:
        - { name: 'net.ipv4.ip_forward', value: '0' }
        - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.send_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.accept_source_route', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_source_route', value: '0' }
        - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.accept_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.secure_redirects', value: '0' }
        - { name: 'net.ipv4.conf.default.secure_redirects', value: '0' }
        - { name: 'net.ipv4.conf.all.log_martians', value: '1' }
        - { name: 'net.ipv4.conf.default.log_martians', value: '1' }
        - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }
        - { name: 'net.ipv4.icmp_ignore_bogus_error_responses', value: '1' }
        - { name: 'net.ipv4.tcp_syncookies', value: '1' }
        - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
        - { name: 'kernel.dmesg_restrict', value: '1' }
        - { name: 'kernel.kptr_restrict', value: '2' }
        - { name: 'fs.suid_dumpable', value: '0' }
        
    # Configure systemd_timesyncd for time synchronization
    - name: Install and configure time synchronization
      systemd:
        name: systemd-timesyncd
        state: started
        enabled: yes
        
    - name: Configure timesyncd servers
      blockinfile:
        path: /etc/systemd/timesyncd.conf
        block: |
          [Time]
          NTP=0.ubuntu.pool.ntp.org 1.ubuntu.pool.ntp.org 2.ubuntu.pool.ntp.org 3.ubuntu.pool.ntp.org
          FallbackNTP=ntp.ubuntu.com
        backup: yes
        
    # Create system security report
    - name: Generate system security report
      shell: |
        echo "=== System Security Hardening Report ===" > /tmp/system-security-report.txt
        echo "Generated: $(date)" >> /tmp/system-security-report.txt
        echo "" >> /tmp/system-security-report.txt
        
        echo "=== Active Services ===" >> /tmp/system-security-report.txt
        systemctl list-units --type=service --state=running | grep -v "loaded" >> /tmp/system-security-report.txt
        echo "" >> /tmp/system-security-report.txt
        
        echo "=== Disabled Services ===" >> /tmp/system-security-report.txt
        systemctl list-units --type=service --state=dead | grep "disabled" >> /tmp/system-security-report.txt
        echo "" >> /tmp/system-security-report.txt
        
        echo "=== Auditd Status ===" >> /tmp/system-security-report.txt
        systemctl is-active auditd >> /tmp/system-security-report.txt 2>/dev/null || echo "Auditd not running" >> /tmp/system-security-report.txt
        echo "" >> /tmp/system-security-report.txt
        
        echo "=== Kernel Security Parameters ===" >> /tmp/system-security-report.txt
        sysctl -a 2>/dev/null | grep -E "(ip_forward|rp_filter|log_martians|tcp_syncookies)" >> /tmp/system-security-report.txt || echo "Kernel parameters not found" >> /tmp/system-security-report.txt
        echo "" >> /tmp/system-security-report.txt
        
        echo "=== Time Synchronization Status ===" >> /tmp/system-security-report.txt
        timedatectl status >> /tmp/system-security-report.txt 2>/dev/null || echo "Time sync status check failed" >> /tmp/system-security-report.txt
        echo "" >> /tmp/system-security-report.txt
        
        echo "=== Removed Packages ===" >> /tmp/system-security-report.txt
        echo "Telnet, RSH, TFTP, NFS, RPCBIND, SQUID, SAMBA, SNMP, CUPS services removed" >> /tmp/system-security-report.txt
        
      register: system_report
        
    - name: Restart auditd to apply changes
      systemd:
        name: auditd
        state: restarted
        enabled: yes
      register: auditd_restart
      failed_when: false
        
    - name: Ensure local results directory exists for host
      file:
        path: "{{ results_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false
        
    - name: Fetch system security report to local
      fetch:
        src: "/tmp/system-security-report.txt"
        dest: "{{ results_dir }}/{{ inventory_hostname }}/system-security-report-{{ ansible_date_time.iso8601 }}.txt"
        flat: yes
        
    - name: Display system hardening status
      debug:
        msg: "System security hardening completed. Report saved to {{ results_dir }}/"
