- name: Security Assessment - OpenSCAP
  hosts: all
  become: yes
  vars_files:
    - ../group_vars/all.yml
  vars:
    results_dir: "../results"
    
  tasks:
    - name: Ensure results directory exists
      file:
        path: "{{ results_dir }}"
        state: directory
        mode: '0755'
        
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
        
    - name: Install OpenSCAP scanner
      apt:
        name:
          - "{{ 'openscap-scanner' if ansible_distribution_version is version('24', '>=') else 'libopenscap8' }}"
          - python3-openscap
        state: present
        
    - name: Download ComplianceAsCode SCAP Security Guide content
      shell: |
        cd /tmp
        wget https://github.com/ComplianceAsCode/content/releases/download/v0.1.78/scap-security-guide-0.1.78.zip
        unzip scap-security-guide-0.1.78.zip
      register: ssg_download
      failed_when: false
        
    - name: Run OpenSCAP scan for Ubuntu 22.04
      shell: |
        cd /tmp/scap-security-guide-0.1.78
        oscap xccdf eval \
          --profile xccdf_org.ssgproject.content_profile_cis_level1_server \
          --results /tmp/result.xml \
          --report /tmp/report.html \
          ./ssg-ubuntu2204-ds.xml
      register: oscap_scan_22
      when: ansible_distribution_version == "22.04"
      failed_when: false
        
    - name: Run OpenSCAP scan for Ubuntu 24.04
      shell: |
        cd /tmp/scap-security-guide-0.1.78
        oscap xccdf eval \
          --profile xccdf_org.ssgproject.content_profile_cis_level1_server \
          --results /tmp/result.xml \
          --report /tmp/report.html \
          ./ssg-ubuntu2404-ds.xml
      register: oscap_scan_24
      when: ansible_distribution_version == "24.04"
      failed_when: false
        
    - name: Copy OpenSCAP XML results to results directory
      copy:
        src: "/tmp/result.xml"
        dest: "{{ results_dir }}/openscap-results-{{ ansible_date_time.iso8601 }}.xml"
        remote_src: yes
      failed_when: false
        
    - name: Copy OpenSCAP HTML report to results directory
      copy:
        src: "/tmp/report.html"
        dest: "{{ results_dir }}/openscap-report-{{ ansible_date_time.iso8601 }}.html"
        remote_src: yes
      failed_when: false
        
    - name: Ensure local results directory exists for host
      file:
        path: "{{ results_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false
        
    - name: Fetch OpenSCAP XML results to local results
      fetch:
        src: "{{ results_dir }}/openscap-results-{{ ansible_date_time.iso8601 }}.xml"
        dest: "{{ results_dir }}/{{ inventory_hostname }}/openscap-results-{{ ansible_date_time.iso8601 }}.xml"
        flat: yes
      failed_when: false
        
    - name: Fetch OpenSCAP HTML report to local results
      fetch:
        src: "{{ results_dir }}/openscap-report-{{ ansible_date_time.iso8601 }}.html"
        dest: "{{ results_dir }}/{{ inventory_hostname }}/openscap-report-{{ ansible_date_time.iso8601 }}.html"
        flat: yes
      failed_when: false
        
    - name: Display OpenSCAP scan status
      debug:
        msg: "OpenSCAP scan completed. Results saved to {{ results_dir }}/"
      
    - name: Clean up temporary files
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/tmp/result.xml"
        - "/tmp/report.html"
        - "/tmp/scap-security-guide-0.1.78.zip"
        - "/tmp/scap-security-guide-0.1.78"
        - "{{ results_dir }}/openscap-results-{{ ansible_date_time.iso8601 }}.xml"
        - "{{ results_dir }}/openscap-report-{{ ansible_date_time.iso8601 }}.html"
      failed_when: false