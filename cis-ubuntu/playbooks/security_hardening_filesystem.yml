---
- name: Security Hardening - Filesystem & AIDE
  hosts: all
  become: yes
  vars_files:
    - ../group_vars/all.yml
  vars:
    results_dir: "../results"
    
  tasks:
    - name: Ensure results directory exists
      file:
        path: "{{ results_dir }}"
        state: directory
        mode: '0755'
        
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
        
    - name: Install AIDE for file integrity monitoring
      apt:
        name:
          - aide
          - aide-common
        state: present
        
    # Create separate partition for /tmp if not exists (warning only)
    - name: Check if /tmp is separate partition
      shell: |
        if mount | grep -q "on /tmp "; then
          echo "/tmp is mounted as separate partition"
          mount | grep "on /tmp "
        else
          echo "/tmp is NOT a separate partition - RECOMMENDATION: Create separate partition"
        fi
      register: tmp_partition_check
      
    # AIDE Configuration
    - name: Configure AIDE
      lineinfile:
        path: /etc/aide/aide.conf
        regexp: '^{{ item.key }}'
        line: '{{ item.key }}={{ item.value }}'
        backup: yes
      loop:
        - { key: 'All', value: 'p+i+n+u+g+s+m+c+md5+sha1+rmd160+tiger+crypt+f+selinux+xattrs+acl' }
        - { key: 'database', value: 'file:/var/lib/aide/aide.db' }
        - { key: 'database_out', value: 'file:/var/lib/aide/aide.db.new' }
        - { key: 'logdir', value: '/var/log/aide' }
        
    - name: Add important directories to AIDE monitoring
      blockinfile:
        path: /etc/aide/aide.conf
        block: |
          # Critical system directories
          /bin All
          /sbin All
          /usr/bin All
          /usr/sbin All
          /lib All
          /lib64 All
          /usr/lib All
          /usr/lib64 All
          /etc All
          /boot All
          /root All
          /home All
          /var All
          
          # Exclude temporary and log directories from detailed checks
          !/var/log
          !/var/tmp
          !/tmp
          !/var/run
          !/var/lock
        backup: yes
        
    # Initialize AIDE database
    - name: Initialize AIDE database
      shell: |
        aide --init
        cp /var/lib/aide/aide.db.new /var/lib/aide/aide.db
      register: aide_init
      failed_when: false
      
    # Create AIDE cron job
    - name: Create AIDE daily check cron job
      cron:
        name: "AIDE Daily Integrity Check"
        job: "/usr/bin/aide --check > /var/log/aide/check.log 2>&1"
        minute: "0"
        hour: "2"
        user: "root"
        cron_file: aide
        
    # Secure /tmp directory permissions
    - name: Set secure permissions on /tmp
      file:
        path: /tmp
        mode: '1777'
        owner: root
        group: root
        
    # Secure sticky bits on world-writable directories
    - name: Ensure sticky bit is set on world-writable directories
      shell: |
        for dir in /tmp /var/tmp /usr/tmp; do
          if [ -d "$dir" ]; then
            chmod 1777 "$dir"
            echo "Secured $dir with sticky bit"
          fi
        done
      register: sticky_bit_set
      
    # Find and secure files without proper ownership
    - name: Find files with improper ownership
      shell: |
        echo "=== Files with improper ownership ===" > /tmp/files-ownership-report.txt
        find / -type f \( ! -user root -a ! -user nobody \) -ls 2>/dev/null | head -20 >> /tmp/files-ownership-report.txt || echo "No improper ownership found" >> /tmp/files-ownership-report.txt
        echo "" >> /tmp/files-ownership-report.txt
        
        echo "=== World-writable files ===" >> /tmp/files-ownership-report.txt
        find / -type f -perm -002 2>/dev/null | head -20 >> /tmp/files-ownership-report.txt || echo "No world-writable files found" >> /tmp/files-ownership-report.txt
        echo "" >> /tmp/files-ownership-report.txt
        
        echo "=== SUID/SGID files ===" >> /tmp/files-ownership-report.txt
        find / -type f \( -perm -4000 -o -perm -2000 \) -exec ls -la {} \; 2>/dev/null | head -20 >> /tmp/files-ownership-report.txt || echo "No SUID/SGID files found" >> /tmp/files-ownership-report.txt
        
      register: ownership_check
        
    # Create filesystem security report
    - name: Generate filesystem security report
      shell: |
        echo "=== Filesystem Security Hardening Report ===" > /tmp/filesystem-security-report.txt
        echo "Generated: $(date)" >> /tmp/filesystem-security-report.txt
        echo "" >> /tmp/filesystem-security-report.txt
        
        echo "=== Partition Information ===" >> /tmp/filesystem-security-report.txt
        df -h >> /tmp/filesystem-security-report.txt
        echo "" >> /tmp/filesystem-security-report.txt
        
        echo "=== Mount Options ===" >> /tmp/filesystem-security-report.txt
        mount | grep -E "(nosuid|nodev|noexec|relatime)" >> /tmp/filesystem-security-report.txt || echo "No secure mount options found" >> /tmp/filesystem-security-report.txt
        echo "" >> /tmp/filesystem-security-report.txt
        
        echo "=== AIDE Status ===" >> /tmp/filesystem-security-report.txt
        if [ -f /var/lib/aide/aide.db ]; then
          echo "AIDE database exists" >> /tmp/filesystem-security-report.txt
          aide --version >> /tmp/filesystem-security-report.txt 2>/dev/null || echo "AIDE version check failed" >> /tmp/filesystem-security-report.txt
        else
          echo "AIDE database not found" >> /tmp/filesystem-security-report.txt
        fi
        echo "" >> /tmp/filesystem-security-report.txt
        
        echo "=== /tmp Partition Status ===" >> /tmp/filesystem-security-report.txt
        mount | grep "/tmp" >> /tmp/filesystem-security-report.txt || echo "/tmp not found as separate mount" >> /tmp/filesystem-security-report.txt
        echo "" >> /tmp/filesystem-security-report.txt
        
        echo "=== Directory Permissions ===" >> /tmp/filesystem-security-report.txt
        ls -ld /tmp /var/tmp /usr/tmp 2>/dev/null || echo "Some temp directories not found" >> /tmp/filesystem-security-report.txt
        
      register: filesystem_report
        
    - name: Ensure local results directory exists for host
      file:
        path: "{{ results_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false
        
    - name: Fetch filesystem security report to local
      fetch:
        src: "/tmp/filesystem-security-report.txt"
        dest: "{{ results_dir }}/{{ inventory_hostname }}/filesystem-security-report-{{ ansible_date_time.iso8601 }}.txt"
        flat: yes
        
    - name: Fetch file ownership report to local
      fetch:
        src: "/tmp/files-ownership-report.txt"
        dest: "{{ results_dir }}/{{ inventory_hostname }}/files-ownership-report-{{ ansible_date_time.iso8601 }}.txt"
        flat: yes
        
    - name: Display filesystem hardening status
      debug:
        msg: "Filesystem security hardening completed. Reports saved to {{ results_dir }}/"
