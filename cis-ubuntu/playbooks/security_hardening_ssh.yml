---
- name: Security Hardening - SSH Configuration
  hosts: all
  become: yes
  vars_files:
    - ../group_vars/all.yml
  vars:
    results_dir: "../results"
    
  tasks:
    - name: Ensure results directory exists
      file:
        path: "{{ results_dir }}"
        state: directory
        mode: '0755'
        
    - name: Update apt package cache
      apt:
        update_cache: yes
        cache_valid_time: 3600
        
    - name: Install OpenSSH server
      apt:
        name:
          - openssh-server
        state: present
        
    # SSH Configuration Hardening
    - name: Backup original SSH configuration
      copy:
        src: /etc/ssh/sshd_config
        dest: /etc/ssh/sshd_config.backup
        remote_src: yes
        mode: '0600'
        
    - name: Configure SSH security settings
      blockinfile:
        path: /etc/ssh/sshd_config
        block: |
          # SSH Security Hardening Configuration
          
          # Authentication settings
          PermitRootLogin no
          PermitEmptyPasswords no
          PermitUserEnvironment no
          
          # Password and authentication
          PasswordAuthentication yes  # Keep enabled for initial setup, can be disabled later
          PubkeyAuthentication yes
          
          # Connection settings
          MaxAuthTries 3
          MaxStartups 10:30:60
          LoginGraceTime 60
          
          # Protocol and encryption
          Protocol 2
          Ciphers aes256-ctr,aes192-ctr,aes128-ctr
          MACs hmac-sha2-256,hmac-sha2-512,umac-128@openssh.com
          KexAlgorithms diffie-hellman-group-exchange-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512
          
          # Logging and banners
          LogLevel INFO
          Banner /etc/ssh/banner
          
          # X11 forwarding (disable if not needed)
          X11Forwarding no
          
          # TCP forwarding (disable if not needed)
          AllowTcpForwarding no
          
          # Port knocking protection
          MaxSessions 10
          
          # Client alive intervals to prevent session hijacking
          ClientAliveInterval 300
          ClientAliveCountMax 2
          
          # Disable host-based authentication
          HostbasedAuthentication no
          IgnoreRhosts yes
          
          # Enable PAM
          UsePAM yes
        backup: yes
        marker: "# {mark} ANSIBLE MANAGED SSH SECURITY BLOCK"
        
    # Create SSH banner
    - name: Create SSH login banner
      copy:
        content: |
          ******************************************************************************
          *                            AUTHORIZED ACCESS ONLY                           *
          ******************************************************************************
          * This system is for authorized users only. Individual use of this           *
          * computer and/or network without authority, or in excess of your           *
          * authority, is strictly prohibited. Unauthorized access is a               *
          * violation of state and federal, civil and criminal laws.                  *
          ******************************************************************************
          * All activities on this system are monitored and recorded.                 *
          ******************************************************************************
        dest: /etc/ssh/banner
        mode: '0644'
        
    # SSH Key Permissions
    - name: Set proper permissions on SSH host keys
      file:
        path: "{{ item }}"
        mode: '0600'
        owner: root
        group: root
      loop:
        - /etc/ssh/ssh_host_rsa_key
        - /etc/ssh/ssh_host_ecdsa_key
        - /etc/ssh/ssh_host_ed25519_key
      ignore_errors: yes
      
    - name: Set proper permissions on SSH public keys
      file:
        path: "{{ item }}"
        mode: '0644'
        owner: root
        group: root
      loop:
        - /etc/ssh/ssh_host_rsa_key.pub
        - /etc/ssh/ssh_host_ecdsa_key.pub
        - /etc/ssh/ssh_host_ed25519_key.pub
      ignore_errors: yes
      
    # SSH Directory Permissions
    - name: Secure SSH configuration directory
      file:
        path: /etc/ssh
        mode: '0755'
        owner: root
        group: root
        recurse: yes
        
    # Create SSH security report
    - name: Generate SSH security report
      shell: |
        echo "=== SSH Security Hardening Report ===" > /tmp/ssh-security-report.txt
        echo "Generated: $(date)" >> /tmp/ssh-security-report.txt
        echo "" >> /tmp/ssh-security-report.txt
        
        echo "=== SSH Version ===" >> /tmp/ssh-security-report.txt
        sshd -V 2>&1 >> /tmp/ssh-security-report.txt
        echo "" >> /tmp/ssh-security-report.txt
        
        echo "=== SSH Configuration Security Settings ===" >> /tmp/ssh-security-report.txt
        grep -E "(PermitRootLogin|PermitEmptyPasswords|MaxAuthTries|Protocol|Ciphers|MACs|LogLevel|ClientAliveInterval)" /etc/ssh/sshd_config >> /tmp/ssh-security-report.txt || echo "SSH security settings not found" >> /tmp/ssh-security-report.txt
        echo "" >> /tmp/ssh-security-report.txt
        
        echo "=== SSH Host Keys Status ===" >> /tmp/ssh-security-report.txt
        ls -la /etc/ssh/ssh_host_* >> /tmp/ssh-security-report.txt 2>/dev/null || echo "SSH host keys not found" >> /tmp/ssh-security-report.txt
        echo "" >> /tmp/ssh-security-report.txt
        
        echo "=== SSH Service Status ===" >> /tmp/ssh-security-report.txt
        systemctl is-active ssh >> /tmp/ssh-security-report.txt 2>/dev/null || echo "SSH service status check failed" >> /tmp/ssh-security-report.txt
        echo "" >> /tmp/ssh-security-report.txt
        
        echo "=== SSH Port Configuration ===" >> /tmp/ssh-security-report.txt
        grep -E "^Port" /etc/ssh/sshd_config >> /tmp/ssh-security-report.txt || echo "Port not specified (default 22)" >> /tmp/ssh-security-report.txt
        echo "" >> /tmp/ssh-security-report.txt
        
        echo "=== SSH Banner Status ===" >> /tmp/ssh-security-report.txt
        if [ -f /etc/ssh/banner ]; then
          echo "SSH banner exists" >> /tmp/ssh-security-report.txt
          echo "Banner content:" >> /tmp/ssh-security-report.txt
          head -3 /etc/ssh/banner >> /tmp/ssh-security-report.txt
        else
          echo "SSH banner not found" >> /tmp/ssh-security-report.txt
        fi
        
      register: ssh_report
        
    - name: Restart SSH service to apply changes
      systemd:
        name: ssh
        state: restarted
        enabled: yes
      register: ssh_restart
      failed_when: false
        
    - name: Ensure local results directory exists for host
      file:
        path: "{{ results_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: '0755'
      delegate_to: localhost
      become: false
        
    - name: Fetch SSH security report to local
      fetch:
        src: "/tmp/ssh-security-report.txt"
        dest: "{{ results_dir }}/{{ inventory_hostname }}/ssh-security-report-{{ ansible_date_time.iso8601 }}.txt"
        flat: yes
        
    - name: Display SSH hardening status
      debug:
        msg: "SSH security hardening completed. Report saved to {{ results_dir }}/"
