---
- name: Ensure required directories exist
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ images_disk_path }}"
    - "{{ cloud_init_seed_path }}"

- name: Create VM disk using backing file
  command: >
    qemu-img create -f qcow2
    -F qcow2
    -b "{{ images_base_path }}/{{ base_images[vm_name] }}"
    "{{ images_disk_path }}/{{ vm_name }}.qcow2"
    {{ vm_disk_size_gb }}G
  args:
    creates: "{{ images_disk_path }}/{{ vm_name }}.qcow2"

- name: Generate cloud-init user-data
  template:
    src: ../templates/cloud-init/user-data.j2
    dest: "{{ cloud_init_seed_path }}/{{ vm_name }}-user-data"
    mode: '0644'

- name: Generate cloud-init meta-data
  template:
    src: ../templates/cloud-init/meta-data.j2
    dest: "{{ cloud_init_seed_path }}/{{ vm_name }}-meta-data"
    mode: '0644'

- name: Generate seed ISO
  command: >
    {{ vm_base_path }}/scripts/gen-seed.sh
    {{ cloud_init_seed_path }}/{{ vm_name }}
  args:
    creates: "{{ cloud_init_seed_path }}/{{ vm_name }}.iso"

- name: Check if VM exists
  command: virsh --connect qemu:///system dominfo {{ vm_name }}
  register: vm_check
  failed_when: false
  changed_when: false

- name: Create VM with virt-install
  command: >
    virt-install --connect qemu:///system --name {{ vm_name }}
    --memory {{ vm_memory_mb }}
    --vcpus {{ vm_vcpus }}
    --disk path={{ images_disk_path }}/{{ vm_name }}.qcow2,format=qcow2,bus=virtio
    --disk path={{ cloud_init_seed_path }}/{{ vm_name }}.iso,device=cdrom
    --network network={{ vm_network }}
    --osinfo ubuntu{{ '22.04' if vm_name == 'u22' else '24.04' }}
    --graphics none
    --import
    --noautoconsole
  when: vm_check.rc != 0

- name: Wait for VM to be running
  command: virsh --connect qemu:///system domstate {{ vm_name }}
  register: vm_state
  retries: 30
  delay: 2
  until: vm_state.stdout == "running"
  when: vm_check.rc != 0

- name: Wait for VM to fully boot (2 minutes)
  pause:
    minutes: 2
  when: vm_check.rc != 0

- name: Get VM IP address
  command: virsh --connect qemu:///system domifaddr {{ vm_name }}
  register: vm_ip
  retries: 90
  delay: 5
  until: 
    - vm_ip.stdout_lines is defined 
    - vm_ip.stdout_lines | length > 2
    - vm_ip.stdout_lines[2] is defined
    - vm_ip.stdout_lines[2].find("192.168.") != -1
  changed_when: false

- name: Extract VM IP address
  set_fact:
    vm_ip_address: "{{ vm_ip.stdout_lines[2] | regex_replace('^.*\\s+([0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}).*', '\\1') | regex_replace('/24', '') }}"
  when: vm_ip.stdout_lines | length > 2

- name: Display VM IP address
  debug:
    msg: "VM {{ vm_name }} IP: {{ vm_ip_address }}"
  when: vm_ip_address is defined

- name: Check if IP already exists in inventory
  command: grep -q "{{ vm_ip_address }}" "{{ vm_base_path }}/../cis-ubuntu/inventory/hosts.ini"
  register: ip_exists
  failed_when: false
  changed_when: false
  when: vm_ip_address is defined
  delegate_to: localhost

- name: Add VM to cis-ubuntu inventory
  lineinfile:
    path: "{{ vm_base_path }}/../cis-ubuntu/inventory/hosts.ini"
    line: "{{ vm_ip_address }} ansible_user={{ vm_user }} ansible_ssh_private_key_file=/home/teifu142/ATE/UIT/NT542/NT542"
    insertafter: '\\[ubuntu_servers\\]'
    state: present
  when: 
    - vm_ip_address is defined
    - ip_exists.rc != 0
  delegate_to: localhost

- name: Notify about IP addition
  debug:
    msg: "Added {{ vm_name }} ({{ vm_ip_address }}) to cis-ubuntu inventory"
  when: 
    - vm_ip_address is defined
    - ip_exists.rc != 0

- name: Notify about IP already exists
  debug:
    msg: "VM {{ vm_name }} IP {{ vm_ip_address }} already exists in inventory"
  when: 
    - vm_ip_address is defined
    - ip_exists.rc == 0